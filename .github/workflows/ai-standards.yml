name: Monthly AI standards review
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
permissions: {}
jobs:
  standards:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/ai-standards-review.yml@e26d5b07bdee2fc54ed5bd607d8041f7fbeaadaf # v1.5.0
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
    secrets:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_KEY: ${{ secrets.BOT_APP_KEY }}
