name: Monthly AI standards review
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
permissions: {}
jobs:
  standards:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/ai-standards-review.yml@f5e165971bf42fd3e5363ebd7baa0d827f81951c # v1.11.0
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
      checks: write
    secrets:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_KEY: ${{ secrets.BOT_APP_KEY }}
