name: Monthly AI standards review
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
permissions: {}
jobs:
  standards:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/ai-standards-review.yml@40b37ce9647cc6cde2adc3d3d1acfc0aa06f92c9 # v1.10.0
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
      checks: write
    secrets:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_KEY: ${{ secrets.BOT_APP_KEY }}
