name: Feature request
description: Suggest a new feature or improvement
labels: [enhancement, "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Given / When / Then, one scenario per line.
    validations:
      required: true
