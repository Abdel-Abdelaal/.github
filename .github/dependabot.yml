version: 2
updates:
  - package-ecosystem: github-actions
    # baseline/ holds copies of these workflows that must stay identical,
    # so they are bumped in the same PR as the root files.
    directories:
      - /
      - /baseline
      - /baseline/new-repo
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      compatible:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    open-pull-requests-limit: 5
  - package-ecosystem: pre-commit
    directory: /baseline
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      compatible-hooks:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    open-pull-requests-limit: 5
