version: 2
updates:
  - package-ecosystem: github-actions
    # baseline/ holds copies of these workflows that must stay identical,
    # so they are bumped in the same PR as the root files.
    directories:
      - /
      - /baseline
      - /baseline/new-repo
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      compatible:
        update-types: [minor, patch]
        # One PR per dependency covering every directory above.
        group-by: dependency-name
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    open-pull-requests-limit: 5
  - package-ecosystem: pre-commit
    # The root config and its baseline copy must stay identical.
    directories:
      - /
      - /baseline
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      compatible-hooks:
        patterns: ["*"]
        update-types: [minor, patch]
        group-by: dependency-name
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    open-pull-requests-limit: 5
